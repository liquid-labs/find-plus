version: 2
items:
    - title: breadthFirstSorter paretPath typo
      id: JFJX
      date: "2026-10-08"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
        - plan/slug:find-paths-union-literal
      text: 'src/lib/sorters.mjs breadthFirstSorter compares a.parentPath.localeCompare(b.paretPath) (typo: paretPath is always undefined), and the ternary is inverted: when parent paths compare equal it returns 0 instead of comparing names, and when they differ it compares names instead of returning the path comparison. The net effect is that ties at the same depth are ordered by name only, ignoring parent directory. The default find() sort (''breadth'') is affected. Fixing it may reorder results for same-depth entries in different directories (observable change; consider for the next major).'
    - title: Dir pruning ignores minimatchOptions
      id: cTaj
      date: "2026-10-08"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
        - plan/slug:find-paths-union-literal
      text: 'src/lib/traverse-dirs.mjs testForInclusionAndFrontier calls minimatch(matchPath, p) and minimatch(rootBit, matchPathBit) without the caller''s minimatchOptions, while the per-file paths/excludePaths tests do pass minimatchOptions. With options such as { nocase: true } or { dot: true }, pruning can skip directories whose contents the per-file criteria would match (e.g. paths [''FOO/*''] with nocase prunes dir ''foo''), so find() silently misses results. Pass minimatchOptions through to the pruning minimatch calls and add traverse-dirs tests covering nocase/dot.'
    - title: Root with glob chars not escaped
      id: zqI2
      date: "2026-10-08"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
        - plan/slug:find-paths-union-literal
      text: Relative paths/excludePaths patterns are anchored as `${fsPath.resolve(root)}/${glob}` (originally in src/lib/add-implied-tests.mjs; anchoring helper moves to src/lib/path-match.mjs rootGlob). The root string is interpolated unescaped, so a root directory whose absolute path contains glob metacharacters ([ ] * ? { } ( )) makes relative patterns mis-match (e.g. root '/tmp/a[1]' never matches its own children). Fix by escaping absRoot with the same escape helper used for literal paths entries (escapeGlob) when building the anchored pattern; this is an observable behavior change for such roots and also affects traverse-dirs.mjs pruning, which compares relative paths separately.
    - title: escapeGlob braces in windows-noescape mode
      id: 5wTv
      date: "2026-10-08"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
        - plan/slug:find-paths-union-literal
      text: 'minimatch 9.0.3''s escape() does not escape { }. escapeGlob (src/lib/path-match.mjs) adds backslash brace escaping in default mode, but with minimatchOptions.windowsPathsNoEscape the bracket form [{] / [}] does not stop brace expansion: a literal name like ''a{b,c}.js'' fails to match itself. Options: pass nobrace for literal-only matching, upgrade minimatch to a version whose escape handles braces (check Node engine compatibility; package.json engines is node >=18), or document as unsupported. Low impact since find-plus builds all patterns with ''/''.'
    - title: README anchor and noSpecial typos
      id: fHeL
      date: "2026-10-08"
      tags:
        - type:documentation
        - priority:unspecified
        - effort:unspecified
        - plan/slug:find-paths-union-literal
      text: 'README.md: the excludePaths option bullet links to #path-matching-for-efficient-searching but the heading is ''Path matching for efficient searches'' (anchor #path-matching-for-efficient-searches); the options list documents `noSpecial` while the code (src/find-plus.mjs) reads `noSpecials`; also ''noBlockDevcies'' and ''Negatvie'' typos, and the Usage example is missing a closing paren on the find({...}) call.'
    - title: Literal entries for excludePaths
      id: JC6t
      date: "2026-10-08"
      tags:
        - type:enhancement
        - priority:unspecified
        - effort:unspecified
        - plan/slug:find-paths-union-literal
      text: 'find() paths accepts { path, literal: true } object entries (normalized via normalizePaths/escapeGlob in src/lib/path-match.mjs), but excludePaths remains string-glob only; callers must call escapeGlob themselves to exclude a metacharacter-named path. Consider accepting the same entry forms in excludePaths for symmetry (normalize before addImpliedTests and traverseDirs pruning, which checks p.endsWith(''/**'')).'
    - title: Hoist escapeGlob(absRoot) out of hot loop
      id: qYVo
      date: "2026-10-08"
      tags:
        - type:optimization
        - priority:low
        - effort:unspecified
        - plan/phase:followups-burndown
        - plan/slug:followups-burndown-fixes
      text: src/lib/path-match.mjs rootGlob calls escapeGlob(absRoot) for every relative glob on every file test, and src/lib/traverse-dirs.mjs (~line 108) does the same per directory per absolute pattern. The result depends only on absRoot and options, so it is loop-invariant. Compute it once (in addImpliedTests / at the start of traverseDirs) or memoize on absRoot. Modest constant-factor cost; low priority.
