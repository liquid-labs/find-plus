version: 2
items:
    - title: README brace sentence truncated
      id: fobB
      date: "2026-10-08"
      tags:
        - type:documentation
        - priority:high
        - plan/phase:followups-burndown
        - effort:unspecified
      text: 'README.md line ~86, in ''Literal paths and escapeGlob'': the sentence on names with braces under windowsPathsNoEscape ends mid-sentence (''(e.g., `a{b,c}.js`) are '' with no predicate and a trailing space). The brace limitation is therefore not actually documented. Complete it, e.g. ''are a known limitation: brace expansion still applies and escapeGlob cannot make them match literally.'' (Reviewer-reported; verified by reading the line.)'
    - title: isIncluded prune omits minimatchOptions
      id: uhXy
      date: "2026-10-08"
      tags:
        - type:bug
        - priority:medium
        - plan/phase:followups-burndown
        - effort:unspecified
      text: 'src/lib/is-included.mjs (~line 36): the isPrunedByExcludePaths call for ancestor directories does not pass minimatchOptions, although find()''s traverse-dirs now does. With options such as dot or nocase and a pruning ''/**'' exclude, isIncluded and find() can disagree on ancestor pruning, contradicting the documented parity. Pass minimatchOptions in that call and add an isIncluded test using nocase or dot with a pruning ''/**'' exclude.'
    - title: Record breadth sort change in CHANGELOG
      id: diAW
      date: "2026-10-08"
      tags:
        - type:documentation
        - priority:low
        - plan/phase:followups-burndown
        - effort:unspecified
      text: The default 'breadth' sort now orders same-depth entries by parent path then name (previously effectively name only due to a typo and inverted ternary). This is an intentional breaking reorder to ship in a new major version; it should be noted in CHANGELOG.md / release notes at release time. README line ~70 ('Other sorts order the whole result set as before') may optionally be reworded.
    - title: Hoist escapeGlob(absRoot) out of hot loop
      id: qYVo
      date: "2026-10-08"
      tags:
        - type:optimization
        - priority:low
        - plan/phase:followups-burndown
        - effort:unspecified
      text: src/lib/path-match.mjs rootGlob calls escapeGlob(absRoot) for every relative glob on every file test, and src/lib/traverse-dirs.mjs (~line 108) does the same per directory per absolute pattern. The result depends only on absRoot and options, so it is loop-invariant. Compute it once (in addImpliedTests / at the start of traverseDirs) or memoize on absRoot. Modest constant-factor cost; low priority.
closed: []
